      .logout-btn {

  <body>
    <div class="admin-container">
      <!-- Login Form -->
      <div id="loginContainer" class="login-container">
        <h1>🔐 Admin Login</h1>
        <form id="loginForm" class="login-form">
          <div class="form-group">
            <label for="username">Username:</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter username"
              required
              autocomplete="username"
            />
          </div>
          <div class="form-group">
            <label for="password">Password:</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter password"
              required
              autocomplete="current-password"
            />
          </div>
          <button type="submit" class="btn btn-primary" id="loginBtn">
            🔓 Login
          </button>
          <div id="loginStatus" class="status"></div>
        </form>
      </div>

      <!-- Admin Content -->
      <div id="adminContent" class="admin-content">
        <!-- Admin Header -->
        <div class="admin-header">
          <h1>🎮 Admin Panel</h1>
          <button class="logout-btn" id="logoutBtn">
            <span>🚪</span>
            <span>Logout</span>
          </button>
        </div>

        <!-- Two Column Layout -->
        <div class="admin-layout">
          <!-- Left Column: Notification Admin Panel -->
          <div class="admin-left-column">
            <h2 style="margin-bottom: 1.5rem; color: #ffeb3b">
              📢 Notification Management
            </h2>

            <form id="notificationForm">
              <div class="form-group">
                <label for="icon">Icon (Emoji):</label>
                <input
                  type="text"
                  id="icon"
                  name="icon"
                  placeholder="🎮"
                  value="🎮"
                  maxlength="2"
                />
              </div>

              <div class="form-group">
                <label for="message">Notification Message:</label>
                <textarea
                  id="message"
                  name="message"
                  placeholder="Enter your notification message here..."
                  required
                ></textarea>
                <small
                  style="
                    color: rgba(255, 255, 255, 0.7);
                    display: block;
                    margin-top: 0.5rem;
                  "
                >
                  Tip: Bạn có thể thêm link HTML như: &lt;a
                  href="/all-games.html"&gt;All Games&lt;/a&gt;
                </small>
              </div>

              <button type="submit" class="btn btn-primary" id="submitBtn">
                💾 Save to Firebase
              </button>
            </form>

            <div id="status" class="status"></div>

            <div class="preview" id="preview" style="display: none">
              <h3>👁️ Preview:</h3>
              <div class="preview-content">
                <span class="preview-icon" id="previewIcon">🎮</span>
                <span class="preview-text" id="previewText"></span>
              </div>
            </div>
          </div>

          <!-- Right Column: Games Management -->
          <div class="admin-right-column">
            <h2 style="margin-bottom: 1.5rem; color: #ffeb3b">
              🎮 Games Management
            </h2>

            <!-- Tab Buttons -->
            <div
              style="
                margin-bottom: 1.5rem;
                display: flex;
                gap: 0.5rem;
                border-bottom: 2px solid rgba(255, 255, 255, 0.2);
              "
            >
              <button
                type="button"
                class="tab-btn active"
                data-tab="load"
                id="tabLoadBtn"
              >
                📥 Load Games
              </button>
              <button
                type="button"
                class="tab-btn"
                data-tab="single"
                id="tabSingleBtn"
              >
                ➕ Add Single
              </button>
              <button
                type="button"
                class="tab-btn"
                data-tab="bulk"
                id="tabBulkBtn"
              >
                📦 Bulk Add
              </button>
            </div>

            <!-- Tab Content: Load Games -->
            <div id="tabLoad" class="tab-content active">
              <div style="margin-bottom: 1.5rem">
                <button
                  type="button"
                  class="btn btn-secondary"
                  id="loadGamesBtn"
                  style="
                    width: 100%;
                    background: linear-gradient(135deg, #2196f3, #1976d2);
                    color: #fff;
                  "
                >
                  📥 Load Games from Firebase
                </button>
              </div>
              <div id="gamesList" style="margin-bottom: 1.5rem">
                <!-- Games will be added here -->
              </div>
              <div id="gamesStatus" class="status"></div>
            </div>

            <!-- Tab Content: Add Single Game -->
            <div id="tabSingle" class="tab-content">
              <div style="margin-bottom: 1.5rem">
                <button
                  type="button"
                  class="btn btn-secondary"
                  id="addGameBtn"
                  style="
                    width: 100%;
                    background: linear-gradient(135deg, #4caf50, #388e3c);
                    color: #fff;
                  "
                >
                  ➕ Add New Game
                </button>
              </div>
              <div id="singleGamesList" style="margin-bottom: 1.5rem">
                <!-- Single games will be added here -->
              </div>
              <div id="singleGamesStatus" class="status"></div>
              <button
                type="button"
                class="btn btn-primary"
                id="uploadGamesBtn"
                style="display: none"
              >
                📤 Upload All Games to Firebase
              </button>
            </div>

            <!-- Tab Content: Bulk Add -->
            <div id="tabBulk" class="tab-content">
              <div
                style="
                  margin-bottom: 1.5rem;
                  padding: 1.5rem;
                  background: rgba(0, 0, 0, 0.3);
                  border-radius: 15px;
                  border: 2px solid rgba(255, 255, 255, 0.2);
                "
              >
                <h3 style="margin-bottom: 1rem; color: #ffeb3b">
                  📦 Bulk Add Games
                </h3>
                <p
                  style="
                    margin-bottom: 1rem;
                    color: rgba(255, 255, 255, 0.8);
                    font-size: 0.9rem;
                  "
                >
                  Nhập danh sách games (mỗi dòng một item). Số lượng dòng phải
                  khớp nhau.
                </p>
                <div class="form-group">
                  <label for="bulkGameNames"
                    >Game Names (mỗi dòng một tên):</label
                  >
                  <textarea
                    id="bulkGameNames"
                    placeholder="Vex 3&#10;Vex 4&#10;Vex 5"
                    style="
                      min-height: 100px;
                      font-family: 'Courier New', monospace;
                    "
                  ></textarea>
                </div>
                <div class="form-group">
                  <label for="bulkGameUrls"
                    >Game URLs (mỗi dòng một URL):</label
                  >
                  <textarea
                    id="bulkGameUrls"
                    placeholder="https://example.com/vex3&#10;https://example.com/vex4&#10;https://example.com/vex5"
                    style="
                      min-height: 100px;
                      font-family: 'Courier New', monospace;
                    "
                  ></textarea>
                </div>
                <div class="form-group">
                  <label for="bulkGameImgs"
                    >Image URLs (mỗi dòng một URL):</label
                  >
                  <textarea
                    id="bulkGameImgs"
                    placeholder="https://example.com/vex3.png&#10;https://example.com/vex4.png&#10;https://example.com/vex5.png"
                    style="
                      min-height: 100px;
                      font-family: 'Courier New', monospace;
                    "
                  ></textarea>
                </div>
                <div style="display: flex; gap: 1rem">
                  <button
                    type="button"
                    class="btn btn-primary"
                    id="processBulkBtn"
                    style="flex: 1; margin-top: 0"
                  >
                    ✅ Process & Add Games
                  </button>
                  <button
                    type="button"
                    class="btn btn-secondary"
                    id="clearBulkBtn"
                    style="
                      flex: 1;
                      margin-top: 0;
                      background: rgba(244, 67, 54, 0.3);
                      border: 2px solid #f44336;
                    "
                  >
                    🗑️ Clear
                  </button>
                </div>
                <div
                  id="bulkGamesStatus"
                  class="status"
                  style="margin-top: 1rem"
                ></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Admin Panel Script -->
    <script src="/games-noti/admin.js"></script>
  </body>
</html>
